[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment6-demo-backend"
version = "0.1.0"
description = "CPU Vietnamese multimodal search demo API"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "python-multipart", "numpy", "Pillow", "pydantic", "python-dotenv", "sentence-transformers", "azure-cognitiveservices-speech", "filelock", "faster-whisper==1.2.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
